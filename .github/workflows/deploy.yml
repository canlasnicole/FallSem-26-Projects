name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://user:$HF_TOKEN@huggingface.co/spaces/canlasnicole/github-actions> main
